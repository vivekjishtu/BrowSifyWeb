/*
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'dagger.hilt.android.plugin'
*/

buildscript {
    repositories {
        maven { url = uri("https://plugins.gradle.org/m2/") }
       // jcenter()
        maven { url = uri('https://jitpack.io/') }
    }

    dependencies {
    }
}

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dagger.hilt.android.plugin'
    id 'com.google.android.gms.oss-licenses-plugin'
    id 'com.google.devtools.ksp'
}

def gitHash = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
def buildTime = new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")

// =============================================================================
// Vendor Branding Resolution
// =============================================================================
// Read the active vendor from gradle.properties (vendorName=browsify)
// The vendor folder must exist at: <rootProject>/vendor/<vendorName>/
def vendorName = project.findProperty("vendorName") ?: "browsify"
def vendorDir = "${rootProject.projectDir}/vendor/${vendorName}"
def vendorResDir = "${vendorDir}/res"

// Read the applicationId from the vendor's brand.properties file
def brandProps = new Properties()
def brandPropsFile = file("${vendorDir}/brand.properties")
if (brandPropsFile.exists()) {
    brandPropsFile.withReader('UTF-8') { brandProps.load(it) }
} else {
    throw new GradleException(
        "Vendor brand.properties not found at: ${vendorDir}/brand.properties\n" +
        "Ensure vendorName='${vendorName}' matches a folder under vendor/.\n" +
        "See VENDOR_GUIDE.md for setup instructions."
    )
}
def vendorApplicationId = brandProps['applicationId'] ?: "com.vivekjishtu.bswbrowser"

logger.lifecycle("[Vendor] Building with vendor: ${vendorName} (applicationId: ${vendorApplicationId})")

android {
    compileSdk = Build.compile_sdk_version
    defaultConfig {
        applicationId = vendorApplicationId
        minSdk = Build.min_sdk_version
        targetSdk = Build.target_sdk_version
        versionCode AppVersions.version_code
        versionName = AppVersions.version_name
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "GIT_HASH", "\"${gitHash}\"")
        buildConfigField("String", "BUILD_TIME", "\"${buildTime}\"")
        resValue("string", "package_name", applicationId)
        resValue("string", "package_build", gitHash)
        resValue("string", "package_build_time", buildTime)
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            lint {
                disable 'MissingTranslation', 'GoogleAppIndexingWarning', 'ClickableViewAccessibility'
            }
        }
        debug {
            applicationIdSuffix = ".debug"
            resValue("string", "package_name", "${defaultConfig.applicationId}.debug")
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/CHANGES', 'META-INF/README.md']
        }
    }

    sourceSets {
        // Merge vendor resources into the main source set.
        // Vendor resources take precedence over module defaults when there is a conflict.
        main {
            res.srcDirs += [vendorResDir]
        }
        debug {
            // Optional: vendor can provide a debug-specific override folder
            def vendorDebugRes = "${vendorDir}/debug/res"
            if (file(vendorDebugRes).exists()) {
                res.srcDirs += [vendorDebugRes]
            }
        }
    }

    applicationVariants.configureEach { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.configureEach { output ->
                if (output.outputFileName.endsWith('.apk')) {
                    // Rename APK
                    def applicationId = defaultConfig.applicationId
                    def versionCode = defaultConfig.versionCode
                    def versionName = defaultConfig.versionName
                    output.outputFileName = "${applicationId}_v${versionName}_${versionCode}.apk"
                }
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace = 'jp.hazuki.yuzubrowser'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation Libs.junit
    androidTestImplementation Libs.espressoCore

    implementation Libs.moshi
    ksp Libs.moshiCodeGen
    implementation Libs.okhttp

    implementation AndroidX.appcompat
    implementation AndroidX.fix_preference
    implementation AndroidX.room
    implementation AndroidX.documentFile
    implementation AndroidX.design
    implementation project(':libraries:asyncpermissions')
    implementation project(':browser')
    implementation project(':module:ui')
    implementation project(':legacy')
    implementation project(':module:core')
    implementation project(':module:webview')
    implementation project(':languages')
    implementation project(':module:favicon')
    implementation project(':module:download')
    implementation project(':module:adblock')
    implementation project(':module:bookmark')
    implementation project(':module:history')
    implementation project(':module:search')

    implementation Libs.kotlin_stdlib

    implementation Dagger.hilt
    ksp Dagger.hiltCompiler

    implementation 'com.google.android.gms:play-services-oss-licenses:17.1.0'

}

// =============================================================================
// Vendor Firebase Config Staging
// =============================================================================
// Copies the vendor's google-services.json to app/ before the build starts.
// The file is gitignored — each vendor provides their own from Firebase Console.
// If the file is missing, the build continues (Firebase features may be disabled).
def vendorGoogleServices = file("${vendorDir}/google-services.json")
def appGoogleServices = file("${projectDir}/google-services.json")

task copyVendorGoogleServices {
    description = "Copies vendor-specific google-services.json to the app directory."
    group = "Vendor"
    doLast {
        if (vendorGoogleServices.exists()) {
            copy {
                from vendorGoogleServices
                into projectDir
            }
            logger.lifecycle("[Vendor] Copied google-services.json from vendor/${vendorName}/")
        } else {
            logger.warn("[Vendor] WARNING: No google-services.json found at ${vendorGoogleServices}. Firebase features may not work.")
        }
    }
}

// Run before every build variant
tasks.whenTaskAdded { task ->
    if (task.name.startsWith("process") && task.name.endsWith("GoogleServices")) {
        task.dependsOn copyVendorGoogleServices
    }
}
